    description: Curated list of Claude Skills and agent-workflow customisations
    url: "https://github.com/ComposioHQ/awesome-claude-skills"
    frequency: weekly
    status: active
    added_at: "2026-08-22"
    notes: Reviewed manually — a skill with many stars points at a workflow people repeat by hand

  ai_collection_directory:
    type: web
    description: Large directory of generative AI applications, grouped by use case
    url: "https://github.com/ai-collection/ai-collection"
    frequency: weekly
    status: paused
    added_at: "2026-08-22"
    notes: Paused — high volume and slow to update; sweep once a quarter for category gaps

